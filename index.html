<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Real Map Drive</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="panel" class="box">
      <div class="row head">
        <strong>Real Map Drive</strong>
        <button id="togglePanel" title="Hide or show this panel">–</button>
      </div>
      <div id="panelBody">
        <form id="searchForm" class="row">
          <input id="search" type="text" placeholder="Search a place name" autocomplete="off" />
          <button type="submit">Go</button>
        </form>
        <div id="results"></div>
        <form id="coordForm" class="row">
          <input id="lat" type="text" inputmode="decimal" placeholder="Latitude" autocomplete="off" />
          <input id="lon" type="text" inputmode="decimal" placeholder="Longitude" autocomplete="off" />
          <button type="submit">Go</button>
        </form>
        <div class="row">
          <select id="presets"><option value="">Jump to a city…</option></select>
          <button id="locate" title="Go to my real location">My location</button>
        </div>

        <div class="sep"></div>
        <div class="row">
          <input id="name" type="text" maxlength="20" placeholder="Your name" />
          <input id="color" type="color" title="Car colour" />
        </div>
        <div class="row">
          <button id="invite" class="wide">Copy invite link</button>
        </div>
        <div id="netStatus" class="dim"></div>
        <div id="players"></div>

        <div class="sep"></div>
        <label class="row check" title="Where the map has streets but no buildings, add plausible houses along them">
          <input id="infill" type="checkbox" /> Fill unmapped streets with guessed buildings
        </label>
        <div class="row">
          <select id="quality" title="Auto lowers the resolution, then the detail, to keep the game smooth on this machine">
            <option value="auto">Graphics: auto (adapts to this machine)</option>
            <option value="low">Graphics: low (slow machines)</option>
            <option value="medium">Graphics: medium</option>
            <option value="high">Graphics: high</option>
          </select>
        </div>
        <div class="row">
          <select id="timeMode" title="Day and night follow the real sun at the place you are driving">
            <option value="real">Time of day: real, for this place</option>
            <option value="day">Time of day: always day</option>
            <option value="night">Time of day: always night</option>
          </select>
        </div>
        <div class="dim keys">
          W/S or ↑/↓ drive · A/D or ←/→ steer · Space handbrake<br />C camera · R back to road
        </div>
      </div>
    </div>

    <canvas id="minimap" width="200" height="200"></canvas>

    <div id="hud">
      <div id="road"></div>
      <div id="speed"><span id="kmh">0</span> km/h</div>
      <div id="coords"></div>
    </div>
    <div id="status" class="box"></div>

    <div id="touch">
      <div class="pad left"><button data-k="left">◀</button><button data-k="right">▶</button></div>
      <div class="pad right"><button data-k="brake">Brake</button><button data-k="gas">Gas</button></div>
    </div>

    <div id="credit">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
      <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ·
      <a href="https://openmaptiles.org" target="_blank" rel="noopener">OpenMapTiles</a>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
